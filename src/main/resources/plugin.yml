name: SimpleTask
version: '${version}'
main: dev.user.simpletask.SimpleTaskPlugin
api-version: '1.21'
folia-supported: true
author: user
description: A simple daily task system for Folia/Paper servers

libraries:
  - com.zaxxer:HikariCP:6.2.1
  - com.h2database:h2:2.3.232
  - com.mysql:mysql-connector-j:9.2.0
  - com.google.code.gson:gson:2.12.1

depend:
  - NBTAPI

softdepend:
  - XConomy
  - CraftEngine
  - PlaceholderAPI

commands:
  task:
    description: Open the daily task GUI
    usage: /task [category]
    aliases: [dailytask, dt]
  taskadmin:
    description: Admin commands for SimpleTask
    usage: /taskadmin <reload|import|list|add|edit|delete>
    permission: simpletask.admin
    aliases: [tadmin]

permissions:
  simpletask.admin:
    description: Allows access to admin commands
    default: op
  simpletask.use:
    description: Allows using the daily task GUI
    default: true
